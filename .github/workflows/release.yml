name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (dry-run only)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate release
        env:
          TAG: ${{ github.ref_name }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = push ]; then
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid tag: $TAG" >&2; exit 1; }
            VERSION="${TAG#v}"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
              { echo "Tag commit is not on main" >&2; exit 1; }
          else
            VERSION="$VERSION_INPUT"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version" >&2; exit 1; }
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - name: Tests
        run: scripts/test.sh
      - name: Release build and appcast
        if: github.event_name == 'push'
        env:
          FOCUSFLOW_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          FOCUSFLOW_SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          FOCUSFLOW_VERSION: ${{ env.VERSION }}
          FOCUSFLOW_BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          CERT: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in CERT CERT_PASSWORD FOCUSFLOW_SPARKLE_PUBLIC_KEY SPARKLE_PRIVATE_KEY; do
            [ -n "${!name}" ] || { echo "Missing required secret: $name" >&2; exit 1; }
          done
          KEYCHAIN="$RUNNER_TEMP/focusflow-release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_FILE="$RUNNER_TEMP/focusflow.p12"
          APPCAST_KEY="$RUNNER_TEMP/sparkle-private-key"
          trap 'security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true; rm -f "$CERT_FILE" "$APPCAST_KEY"' EXIT
          printf '%s' "$CERT" | base64 --decode > "$CERT_FILE"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$APPCAST_KEY"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_FILE" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN"
          FOCUSFLOW_SIGN_IDENTITY="FocusFlow Developer" scripts/release.sh
          ZIP="build/release/FocusFlow-$VERSION.zip"
          export RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/$(basename "$ZIP")"
          export RELEASE_NOTES_FILE=CHANGELOG.md
          printf '%s' "$SPARKLE_PRIVATE_KEY" | scripts/make-appcast.sh "$ZIP" "$VERSION" "$BUILD_NUMBER" "$FOCUSFLOW_SPARKLE_PUBLIC_KEY" - "build/release/appcast.xml"
      - name: Verify appcast
        if: github.event_name == 'push'
        run: xmllint --noout build/release/appcast.xml
      - name: Create draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --draft --title "FocusFlow $VERSION" --notes-file CHANGELOG.md
          gh release upload "v$VERSION" build/release/FocusFlow-"$VERSION".dmg build/release/FocusFlow-"$VERSION".zip build/release/appcast.xml
      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$VERSION" --draft=false
