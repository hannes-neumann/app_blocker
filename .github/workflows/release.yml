name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-and-dry-run:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Validate ref and version
        env:
          TAG: ${{ github.ref_name }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = push ]; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid tag" >&2; exit 1; }
            [ "$(git cat-file -t "$TAG")" = tag ] || { echo "Release tag must be annotated" >&2; exit 1; }
            git cat-file -e "$TAG^{commit}" || { echo "Tag commit does not exist" >&2; exit 1; }
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
              { echo "Tag commit is not on main" >&2; exit 1; }
            VERSION="${TAG#v}"
          else
            VERSION="$VERSION_INPUT"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version" >&2; exit 1; }
          fi
          awk -v version="$VERSION" '$0 == "## " version { found=1 } END { exit !found }' CHANGELOG.md ||
            { echo "CHANGELOG has no ## $VERSION section" >&2; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - name: Tests
        run: scripts/test.sh
      - name: Ad hoc dry-run build
        if: github.event_name == 'workflow_dispatch'
        env:
          FOCUSFLOW_VERSION: ${{ env.VERSION }}
          FOCUSFLOW_BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        run: FOCUSFLOW_SIGN_IDENTITY=- scripts/release.sh
      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: FocusFlow-${{ env.VERSION }}-dry-run
          path: build/release/FocusFlow-${{ env.VERSION }}.*

  publish:
    if: github.event_name == 'push'
    needs: test-and-dry-run
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Validate tag and secrets
        env:
          TAG: ${{ github.ref_name }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          CERT: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid tag" >&2; exit 1; }
          [ "$(git cat-file -t "$TAG")" = tag ] || { echo "Release tag must be annotated" >&2; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "Tag commit is not on main" >&2; exit 1; }
          for name in POSTHOG_KEY SPARKLE_PUBLIC_KEY SPARKLE_PRIVATE_KEY CERT CERT_PASSWORD; do
            [ -n "${!name}" ] || { echo "Missing required secret: $name" >&2; exit 1; }
          done
          ! grep -q TODO PRIVACY.md || { echo "PRIVACY.md still has TODOs" >&2; exit 1; }
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          NOTES_FILE="$RUNNER_TEMP/focusflow-release-notes.md"
          awk -v version="${TAG#v}" '
            $0 == "## " version { found=1; print; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 2 }
          ' CHANGELOG.md > "$NOTES_FILE" || { echo "Missing release notes section" >&2; exit 1; }
          echo "RELEASE_NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"
      - name: Build and sign
        env:
          FOCUSFLOW_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          FOCUSFLOW_SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          FOCUSFLOW_VERSION: ${{ env.VERSION }}
          FOCUSFLOW_BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          CERT: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/focusflow-release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_FILE="$RUNNER_TEMP/focusflow.p12"
          OLD_KEYCHAINS="$RUNNER_TEMP/focusflow-keychains"
          trap 'security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true; security list-keychains -d user -s $(cat "$OLD_KEYCHAINS") >/dev/null 2>&1 || true; rm -f "$CERT_FILE"' EXIT
          security list-keychains -d user | sed 's/[ "]//g' > "$OLD_KEYCHAINS"
          printf '%s' "$CERT" | base64 --decode > "$CERT_FILE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_FILE" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(cat "$OLD_KEYCHAINS")
          FOCUSFLOW_SIGN_IDENTITY="FocusFlow Developer" scripts/release.sh
          ZIP="build/release/FocusFlow-$VERSION.zip"
          export RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/$(basename "$ZIP")"
          printf '%s' "$SPARKLE_PRIVATE_KEY" |
            scripts/make-appcast.sh "$ZIP" "$VERSION" "$BUILD_NUMBER" "$SPARKLE_PUBLIC_KEY" - "build/release/appcast.xml"
          xmllint --noout build/release/appcast.xml
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            [ "$(gh release view "v$VERSION" --json isDraft --jq .isDraft)" = true ] ||
              { echo "Refusing to modify an already published release" >&2; exit 1; }
            gh release upload "v$VERSION" --clobber build/release/FocusFlow-"$VERSION".dmg build/release/FocusFlow-"$VERSION".zip build/release/appcast.xml
          else
            gh release create "v$VERSION" --draft --verify-tag --title "FocusFlow $VERSION" --notes-file "$RELEASE_NOTES_FILE"
            gh release upload "v$VERSION" build/release/FocusFlow-"$VERSION".dmg build/release/FocusFlow-"$VERSION".zip build/release/appcast.xml
          fi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v$VERSION" --draft=false
